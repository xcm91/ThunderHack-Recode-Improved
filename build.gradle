plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
    id 'java'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = "ThunderHack-Recode"
version = "1.0.0"
group = "thunder.hack"

loom {
    accessWidenerPath = file("src/main/resources/thunderhack.accesswidener")
    mixin.defaultRefmapName = "thunderhack.refmap.json"
}

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.meteordev.org/releases" }
}

dependencies {
    // Minecraft & Fabric
    minecraft "com.mojang:minecraft:1.21"
    mappings "net.fabricmc:yarn:1.21+build.9:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.100.1+1.21"

    // Core dependencies
    implementation "com.google.guava:guava:32.1.3-jre"
    implementation "org.jetbrains:annotations:24.0.1"

    // Meteor Orbit
    implementation "meteordevelopment:orbit:0.2.4"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        filter { it.replace("%version%", project.version) }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "${archivesBaseName}-${version}.jar"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
